name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: insti-attend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rxing-wasm

      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run type check
        run: pnpm check

      - name: Build production bundle
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: dist/
          retention-days: 1

  preview:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'branch')

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: build-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
              --project-name=${{ env.PROJECT_NAME }}
              --branch=dev
              --commit-hash=${{ github.sha }}
              --commit-message="${{ github.event.head_commit.message }}"

  production:
    name: Release & Deploy Production
    needs: build
    runs-on: ubuntu-latest

    if: github.ref_type == 'tag'

    permissions:
      contents: write
      deployments: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message=${{ github.ref_name }}

      - name: Archive build artifacts
        run: |
          tar -czf ${{ env.PROJECT_NAME }}-${{ github.ref_name }}.tar.gz -C dist .
          (cd dist && zip -r ../${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip .)

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            ${{ env.PROJECT_NAME }}-${{ github.ref_name }}.tar.gz
            ${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip
