[package]
name = "rxing-wasm"
version = "0.9.2"
edition = "2024"
description = "WebAssembly barcode decoding bindings for Insti Attend powered by rxing"
repository = "https://github.com/arghyadipchak/insti-attend"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rxing = {
  version = "0.9.2",
  default-features = false,
  features = ["decoders", "encoding_rs", "oned", "wasm_support"]
}
wasm-bindgen = "0.2.127"
web-sys = {
  version = "0.3.104",
  features = ["ImageData", "OffscreenCanvasRenderingContext2d"]
}

[profile.release]
lto = true
codegen-units = 1
