[package]
name = "rxing-wasm"
version = "0.9.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rxing = {
  version = "0.9.0",
  default-features = false,
  features = ["decoders", "encoding_rs", "wasm_support"]
}
wasm-bindgen = "0.2.122"
web-sys = {
  version = "0.3.99",
  features = ["ImageData", "OffscreenCanvasRenderingContext2d"]
}

[profile.release]
lto = true
codegen-units = 1
